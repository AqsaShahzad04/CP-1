
<style>#wrap{width:100%;overflow-x:auto;background:#fff;}canvas{display:block;}</style>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
const canvas=document.getElementById('c');
const dpr=window.devicePixelRatio||1;
const W=1400,H=1120;
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.width=W+'px';canvas.style.height=H+'px';
const g=canvas.getContext('2d');
g.scale(dpr,dpr);

const D=10;

function node(x,y,w,h,stereo,label,tech){
  g.fillStyle='#fdf6e3';g.strokeStyle='#444';g.lineWidth=1.3;
  g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h);
  g.fillStyle='#ede4cc';
  g.beginPath();g.moveTo(x,y);g.lineTo(x+D,y-D);g.lineTo(x+w+D,y-D);g.lineTo(x+w,y);g.closePath();
  g.fill();g.stroke();
  g.fillStyle='#e0d8c0';
  g.beginPath();g.moveTo(x+w,y);g.lineTo(x+w+D,y-D);g.lineTo(x+w+D,y+h-D);g.lineTo(x+w,y+h);g.closePath();
  g.fill();g.stroke();
  g.fillStyle='#666';g.font='9.5px monospace';g.textAlign='center';
  g.fillText('\u00AB'+stereo+'\u00BB',x+w/2,y+17);
  g.fillStyle='#111';g.font='bold 11.5px monospace';
  g.fillText(':'+label,x+w/2,y+33);
  if(tech){g.fillStyle='#888';g.font='9px monospace';g.fillText('['+tech+']',x+w/2,y+48);}
}

function env(x,y,w,h,label){
  g.fillStyle='#f5edda';g.strokeStyle='#888';g.lineWidth=0.9;
  g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h);
  g.fillStyle='#999';g.font='8.5px monospace';g.textAlign='center';
  g.fillText('\u00ABexecution environment\u00BB',x+w/2,y+13);
  g.fillStyle='#111';g.font='bold 10px monospace';
  g.fillText(':'+label,x+w/2,y+26);
}

function art(x,y,w,h,label){
  g.fillStyle='#fff';g.strokeStyle='#aaa';g.lineWidth=0.9;
  g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h);
  const fx=x+w-10;
  g.beginPath();g.moveTo(fx,y);g.lineTo(fx,y+9);g.lineTo(x+w,y+9);g.stroke();
  g.beginPath();g.moveTo(fx,y);g.lineTo(x+w,y+9);g.stroke();
  g.fillStyle='#222';g.font='9.5px monospace';g.textAlign='center';
  const lines=label.split('\n');
  lines.forEach((l,i)=>g.fillText(l,x+(w-10)/2,y+h/2+(i-(lines.length-1)/2)*13+2));
}

function wire(x1,y1,x2,y2,lbl){
  g.strokeStyle='#555';g.lineWidth=1;g.setLineDash([]);
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  if(lbl){
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    const tw=g.measureText(lbl).width+10;
    g.fillStyle='#fff';g.fillRect(mx-tw/2,my-9,tw,14);
    g.fillStyle='#333';g.font='8.5px monospace';g.textAlign='center';
    g.fillText(lbl,mx,my+2);
  }
}

function route(pts,lbl,lx,ly){
  g.strokeStyle='#555';g.lineWidth=1;g.setLineDash([]);
  g.beginPath();
  pts.forEach(([x,y],i)=>i===0?g.moveTo(x,y):g.lineTo(x,y));
  g.stroke();
  if(lbl){
    const tw=g.measureText(lbl).width+10;
    g.fillStyle='#fff';g.fillRect(lx-tw/2,ly-9,tw,14);
    g.fillStyle='#333';g.font='8.5px monospace';g.textAlign='center';
    g.fillText(lbl,lx,ly+2);
  }
}

function notebox(x,y,w,lines){
  const h=lines.length*15+16;
  g.fillStyle='#fffde7';g.strokeStyle='#bbb';g.lineWidth=0.8;g.setLineDash([5,3]);
  g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h);g.setLineDash([]);
  g.fillStyle='#555';g.font='8.5px monospace';g.textAlign='left';
  lines.forEach((l,i)=>g.fillText(l,x+7,y+14+i*15));
}

g.fillStyle='#fff';g.fillRect(0,0,W,H);

g.fillStyle='#111';g.font='bold 13px monospace';g.textAlign='center';
g.fillText('SYNC \u2013 AI POWERED HEALTHCARE PLATFORM \u2013 UML DEPLOYMENT DIAGRAM',W/2,28);
g.strokeStyle='#ccc';g.lineWidth=0.7;
g.beginPath();g.moveTo(30,37);g.lineTo(W-30,37);g.stroke();

const AH=26,AG=6;

function col(x,y,nw,nh,stereo,nlabel,tech,envLabel,arts,envTopPad){
  const ep=envTopPad||56;
  node(x,y,nw,nh,stereo,nlabel,tech);
  const ex=x+12,ey=y+ep,ew=nw-24;
  const eh=nh-(ep+10);
  env(ex,ey,ew,eh,envLabel);
  const ax=ex+8,aw=ew-16,ay0=ey+34;
  arts.forEach((a,i)=>art(ax,ay0+i*(AH+AG),aw,AH,a));
}

const NW=205, NH_base=58;
function nodeH(artCount,envTopPad){
  const ep=envTopPad||56;
  return ep+10+34+artCount*(AH+AG)+10;
}

const R1Y=60;
const C1X=30,C2X=268,C3X=510,C4X=775,C5X=1060;

const h1=nodeH(4);
col(C1X,R1Y,NW,h1,'device','Client Device','',
    'User Interfaces',['Web Browser','Mobile Browser','Patient Interface','Doctor Interface']);

const h2=nodeH(4);
col(C2X,R1Y,NW,h2,'server','Frontend Server','React + Vite',
    'React Application',['React Frontend','Tailwind CSS UI','Auth Pages','AI Symptom Checker UI']);

const BW=230,h3=nodeH(5);
col(C3X,R1Y,BW,h3,'server','Backend API Server','FastAPI + Python',
    'FastAPI Application',['REST API Endpoints','JWT Authentication','Appointment Service','Video Consultation Svc','AI Request Handler']);

const h4=nodeH(4);
col(C4X,R1Y,NW,h4,'service','Auth Service','',
    'Auth Components',['JWT Manager','Session Validator','Role-Based Access Ctrl','Secure Token Service']);

const h5=nodeH(3,52);
col(C5X,R1Y,NW,h5,'service','Notification Service','',
    'Notif Components',['Email Notifications','Appointment Alerts','AI Response Alerts'],52);

const R2Y=440;
const C6X=30,C7X=280,C8X=545,C9X=820;

const AIW=220,h6=nodeH(5,62);
col(C6X,R2Y,AIW,h6,'AI server','AI Processing Server','LLM + RAG Pipeline',
    'AI Components',['AI Health Agent','Symptom Analysis Engine','RAG Engine','Embedding Generator','Patient Memory Processor'],62);

const VW=220,h7=nodeH(4,62);
col(C7X,R2Y,VW,h7,'database','Medical Knowledge\nVector Store','pgvector',
    'Vector DB',['Medical Documents','Embeddings','Semantic Search Index','Vector Retrieval Engine'],62);

const DBW=240,h8=nodeH(5,62);
col(C8X,R2Y,DBW,h8,'database','PostgreSQL Database','PostgreSQL + Supabase',
    'RDBMS',['Users / Auth Sessions','Patients & Doctors','Appointments Table','Prescriptions Table','Patient Memory Table'],62);

const VDW=220,h9=nodeH(3,62);
col(C9X,R2Y,VDW,h9,'external service','Video Consultation\nProvider','Whereby SDK',
    'Video API',['Meeting Generator','Secure Video Rooms','Video Session API'],62);

const R1mid=R1Y+h1/2;
const R2mid=R2Y+h6/2;
const beX=C3X+BW/2;

wire(C1X+NW, R1Y+h1/2, C2X, R1Y+h2/2, 'HTTPS');
wire(C2X+NW, R1Y+h2/2, C3X, R1Y+h3/2, 'REST API / JSON');
wire(C3X+BW, R1Y+h3/2, C4X, R1Y+h4/2, 'JWT Validation');

route([
  [C5X,R1Y+h5/2],
  [C4X+NW+20,R1Y+h5/2],
  [C4X+NW+20,R1Y+h4*0.75],
  [C4X+NW,R1Y+h4*0.75]
],'Email / Alerts', C4X+NW+60, R1Y+h5/2);

wire(beX, R1Y+h3, beX, R2Y, 'SQL Queries');

route([
  [C3X, R1Y+h3*0.6],
  [C6X+AIW/2, R1Y+h3*0.6],
  [C6X+AIW/2, R2Y]
],'AI Processing Req', (C3X+C6X+AIW/2)/2, R1Y+h3*0.6);

wire(C6X+AIW, R2Y+h6/2, C7X, R2Y+h7/2, 'Embed Search');

route([
  [C3X+BW, R1Y+h3*0.8],
  [C9X+VDW/2, R1Y+h3*0.8],
  [C9X+VDW/2, R2Y]
],'Video API Calls', (C3X+BW+C9X+VDW/2)/2, R1Y+h3*0.8);

const NY=R2Y+Math.max(h6,h7,h8,h9)+30;

notebox(30,NY,400,[
  '\u00ABnote\u00BB Security: All communications secured via HTTPS.',
  'JWT-based auth applied at every API endpoint.',
  'Role-based access control enforced server-side.'
]);
notebox(460,NY,400,[
  '\u00ABnote\u00BB AI Subsystem: Uses Retrieval-Augmented Generation',
  '(RAG) for contextual medical assistance.',
  'Patient memory stored for personalized AI responses.'
]);
notebox(890,NY,400,[
  '\u00ABnote\u00BB Database: Medical history, appointments &',
  'prescriptions stored in PostgreSQL (Supabase).',
  'Vector embeddings stored separately in pgvector.'
]);

g.strokeStyle='#ddd';g.lineWidth=0.6;g.setLineDash([]);
g.strokeRect(12,12,W-24,H-24);
g.fillStyle='#bbb';g.font='8.5px monospace';g.textAlign='right';
g.fillText('SYNC Healthcare Platform \u2014 BSCS FYP \u2014 UML Deployment Diagram',W-18,H-10);
</script>
